name: Build, Sign & Release CLI

on:
  push:
    tags:
      - '*'    # Trigger on push to any tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # SDK is consumed from the fork via a go.mod replace directive.
      GOPRIVATE: github.com/impuls42/*
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure tags and history are available for versioning/changelog

      - name: Setup git auth for private Go modules
        env:
          WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${WORKFLOW_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.6.0'

      - name: Prepare cosign private key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: echo "$COSIGN_PRIVATE_KEY" > cosign.key

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSPHRASE }}

      - name: Clean up signing key
        if: always()
        run: rm -f cosign.key
